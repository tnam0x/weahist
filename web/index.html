<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather History</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Apply the saved/OS theme before first paint to avoid a light flash.
      (function () {
        var t = "system";
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var p = JSON.parse(localStorage.getItem("weahist.prefs.v1") || "{}");
          t = q || p.theme || "system";
        } catch (e) {}
        if (t === "system") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  </head>
  <body>
    <div id="error-banner" class="error-banner" role="alert" hidden>
      <span id="error-banner-text"></span>
      <button
        type="button"
        id="error-banner-close"
        class="error-banner-close"
        aria-label="Dismiss"
      >
        ✕
      </button>
    </div>

    <div class="sticky-top">
      <header class="app-header">
        <div class="bar">
          <h1 class="brand">🌤 Weather History</h1>
          <div class="header-actions">
            <button type="button" id="share" class="btn-ghost header-btn" aria-label="Share this view">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                <circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                <circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2" />
              </svg>
              <span class="btn-label">Share</span>
            </button>
            <select id="theme-select" class="theme-select" aria-label="Theme">
              <option value="system">🖥 System</option>
              <option value="light">☀ Light</option>
              <option value="dark">🌙 Dark</option>
            </select>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Filters">
        <div class="bar">
          <div class="field field-location">
            <label for="location-input">Location</label>
            <div class="input-group">
              <div class="autocomplete">
                <input
                  id="location-input"
                  type="text"
                  placeholder="Search a city"
                  autocomplete="off"
                  spellcheck="false"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-controls="location-suggestions"
                  aria-expanded="false"
                />
                <ul id="location-suggestions" class="suggestions" role="listbox" hidden></ul>
              </div>
              <button type="button" id="locate" class="icon-btn" aria-label="Use my location" title="Use my location">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                  <circle cx="12" cy="12" r="2.5" fill="currentColor" />
                  <path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field field-range">
            <span class="field-label" id="range-label">Time range</span>
            <div class="chip-row">
              <div id="range-chips" class="chips" role="radiogroup" aria-labelledby="range-label">
              <button type="button" role="radio" class="chip" data-range="1d" aria-checked="false" aria-label="Last 24 hours" title="Last 24 hours">24h</button>
              <button type="button" role="radio" class="chip" data-range="3d" aria-checked="false" aria-label="Last 3 days" title="Last 3 days">3d</button>
              <button type="button" role="radio" class="chip" data-range="1w" aria-checked="false" aria-label="Last 7 days" title="Last 7 days">7d</button>
              <button type="button" role="radio" class="chip" data-range="2w" aria-checked="false" aria-label="Last 2 weeks" title="Last 2 weeks">2w</button>
              <button type="button" role="radio" class="chip" data-range="1m" aria-checked="false" aria-label="Last 30 days" title="Last 30 days">30d</button>
              <button type="button" role="radio" class="chip" data-range="3m" aria-checked="false" aria-label="Last 3 months" title="Last 3 months">3m</button>
              <button type="button" role="radio" class="chip" data-range="6m" aria-checked="false" aria-label="Last 6 months" title="Last 6 months">6m</button>
              <button type="button" role="radio" class="chip" data-range="1y" aria-checked="false" aria-label="Last 1 year" title="Last 1 year">1y</button>
              </div>
              <button type="button" id="custom-toggle" class="chip" aria-expanded="false" aria-controls="custom-range">Custom</button>
            </div>
          </div>

          <div class="field field-units">
            <span class="field-label" id="units-label">Units</span>
            <div id="units" class="segmented" role="radiogroup" aria-labelledby="units-label">
              <button type="button" role="radio" class="chip" data-units="c" aria-checked="true">°C</button>
              <button type="button" role="radio" class="chip" data-units="f" aria-checked="false">°F</button>
            </div>
          </div>
        </div>

        <form id="custom-range" class="bar custom-range" hidden novalidate>
          <label class="field">
            <span class="field-label">From</span>
            <input type="date" id="custom-start" required />
          </label>
          <label class="field">
            <span class="field-label">To</span>
            <input type="date" id="custom-end" required />
          </label>
          <button type="submit" class="btn-primary">Apply</button>
          <p id="custom-error" class="field-error" role="alert"></p>
        </form>
      </section>
      <div id="loading" class="progress" role="progressbar" aria-label="Loading" hidden></div>
    </div>

    <main class="bar">
      <div id="status" class="status" role="status"></div>
      <header class="page-head">
        <div>
          <h2 id="place-title" class="page-title"></h2>
          <p id="range-subtitle" class="page-sub"></p>
        </div>
        <button type="button" id="download-csv" class="btn-ghost" hidden>
          Download CSV
        </button>
      </header>
      <section id="kpis" class="kpis" aria-label="Summary" hidden></section>
      <section id="charts" class="charts" aria-label="Charts">
        <article class="card chart-card" data-chart="temperature">
          <header class="card-head">
            <div>
              <h3 class="card-title">Temperature</h3>
              <p class="card-sub">°C</p>
            </div>
            <div class="card-actions">
              <button type="button" class="btn-ghost" data-action="png" aria-label="Download chart as PNG">
                PNG
              </button>
              <button type="button" class="btn-ghost" data-action="table" aria-pressed="false">
                Table
              </button>
            </div>
          </header>
          <div class="chart-wrap">
            <div id="chart-temperature" class="chart"></div>
          </div>
          <div class="table-wrap" hidden></div>
          <p class="card-empty" hidden></p>
        </article>
        <article class="card chart-card" data-chart="humidity">
          <header class="card-head">
            <div>
              <h3 class="card-title">Relative humidity</h3>
              <p class="card-sub">%</p>
            </div>
            <div class="card-actions">
              <button type="button" class="btn-ghost" data-action="png" aria-label="Download chart as PNG">
                PNG
              </button>
              <button type="button" class="btn-ghost" data-action="table" aria-pressed="false">
                Table
              </button>
            </div>
          </header>
          <div class="chart-wrap">
            <div id="chart-humidity" class="chart"></div>
          </div>
          <div class="table-wrap" hidden></div>
          <p class="card-empty" hidden></p>
        </article>
        <article class="card chart-card" data-chart="aqi">
          <header class="card-head">
            <div>
              <h3 class="card-title">Air quality</h3>
              <p class="card-sub">US AQI</p>
              <ul class="band-legend" aria-label="AQI categories" hidden></ul>
            </div>
            <div class="card-actions">
              <button type="button" class="btn-ghost" data-action="png" aria-label="Download chart as PNG">
                PNG
              </button>
              <button type="button" class="btn-ghost" data-action="table" aria-pressed="false">
                Table
              </button>
            </div>
          </header>
          <div class="chart-wrap">
            <div id="chart-aqi" class="chart"></div>
          </div>
          <div class="table-wrap" hidden></div>
          <p class="card-empty" hidden></p>
        </article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <footer class="app-footer">
      <div>
        Source:
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
        · <a href="#" id="reset-prefs">Reset preferences</a>
      </div>
      <div class="author">
        Made with <span class="heart" aria-label="love">❤️</span> by
        <strong>tnam0x</strong> ·
        <a href="mailto:namtran4194@gmail.com">namtran4194@gmail.com</a>
      </div>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
