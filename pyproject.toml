[project]
name = "weahist"
version = "0.2.0"
description = "Weather & air-quality history web app (static, Open-Meteo) — build and test tooling."
readme = "README.md"
authors = [
    { name = "Nam Tran Xuan", email = "NamTX12@fpt.com" }
]
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# Not an installable package: this project only holds the site build
# script and the browser test suite for the static app in web/.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: browser tests of the static frontend in web/ (Playwright)",
]
